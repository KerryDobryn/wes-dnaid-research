[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wes-dnaid-research"
version = "0.1.0"
description = "Local, versioned research DNA fingerprints with HMAC pseudonyms"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
dnaid = "dnaid.cli:main"

[tool.setuptools.packages.find]
include = ["dnaid*"]
